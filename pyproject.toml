[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lume"
version = "2.0.0.dev0"
description = "Lume — As Dez Fronteiras: plataforma 2D original em Python com arte vetorial em alta definição"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pygame-ce>=2.5.0,<3",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lume = "lume.__main__:main"

[tool.setuptools.packages.find]
include = ["lume*"]

[tool.setuptools.package-data]
lume = ["data/*.json", "data/levels/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
  "graphics: renders frames with the SDL software renderer (slower)",
  "slow: long simulations",
]
