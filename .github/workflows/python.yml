name: Edição Python (testes)
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      LUME_NO_DISK_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar a campanha
        run: python -m lume --validate
      - name: Testes (lógica, fases, rotas, salvamento, gráficos)
        run: python -m pytest -q
      - name: Matriz de qualidade
        run: python tools/quality_matrix.py --check
